[paper]
title = "Conplexity of the emptiness of the intersecion of regular languages and copying language generating devices."
story = "In this article is proved that every language generating device capable of generating the language of copying words, cannot have both a polinomial algorithm to intesect it with a finite automata and an a polinomial algorithm to decide if it is empty."
section = "Algorithms, automata, complexity and games"

